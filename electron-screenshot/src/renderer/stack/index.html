<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; clipboard-read 'self'; clipboard-write 'self'">
  <title>截图收集</title>
  <link rel="stylesheet" href="stack.css">
</head>
<body>
  <!-- 标题栏（可拖拽） -->
  <div id="titlebar">
    <span class="title-text">截图收集 <span id="count">(0/10)</span></span>
  </div>

  <!-- 提示词 -->
  <div id="tipBar">💡 多选截图以生成组合图</div>

  <!-- 缩略图列表 -->
  <div id="thumbList"></div>

  <!-- 底部操作 -->
  <div id="footer">
    <button id="btnSubmit" disabled>提BUG</button>
    <button id="btnCombine" disabled>组合图</button>
    <button id="btnClear" title="清空">清空</button>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="stack.js"></script>
</body>
</html>
