<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' http://127.0.0.1:8000 data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>录屏</title>
  <link rel="stylesheet" href="record.css">
</head>
<body>
  <!-- 录制控制条 -->
  <div id="ctrlBar">
    <button id="btnStart" class="rec-btn start">● 开始录制</button>
    <button id="btnPause" class="rec-btn hidden">⏸</button>
    <button id="btnStop" class="rec-btn stop hidden">■ 停止</button>
    <span id="timer" class="timer hidden">00:00</span>
    <span id="status" class="status"></span>
    <button id="btnClose" class="rec-btn close" title="关闭">✕</button>
  </div>

  <!-- 录制完成后的预览 + 操作 -->
  <div id="resultPanel" class="hidden">
    <video id="preview" controls></video>
    <div id="resultActions">
      <span id="resultStatus" class="status"></span>
      <button id="btnSave" class="act-btn">保存到桌面</button>
      <button id="btnDiscard" class="act-btn">放弃</button>
    </div>
  </div>

  <script src="record.js"></script>
</body>
</html>
