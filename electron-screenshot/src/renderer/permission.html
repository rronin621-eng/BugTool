<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      color: #1d2129;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      -webkit-app-region: drag;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: #86909c;
      line-height: 1.5;
    }

    .permission-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .permission-item {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid #e5e6eb;
    }

    .permission-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .permission-icon.screen {
      background: #e8f3ff;
    }

    .permission-icon.accessibility {
      background: #fff3e8;
    }

    .permission-info {
      flex: 1;
      min-width: 0;
    }

    .permission-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .permission-desc {
      font-size: 12px;
      color: #86909c;
      line-height: 1.5;
    }

    .permission-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .permission-status.granted {
      color: #00b42a;
      background: #e8ffea;
    }

    .permission-status.missing {
      color: #f53f3f;
      background: #ffe8e8;
    }

    .permission-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      font-weight: 500;
    }

    .btn-primary {
      background: #165dff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #306aff;
    }

    .btn-primary:active {
      background: #114fd4;
    }

    .btn-primary:disabled {
      background: #94bfff;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f2f3f5;
      color: #4e5969;
      border: 1px solid #e5e6eb;
    }

    .btn-secondary:hover {
      background: #e5e6eb;
    }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .footer .btn {
      font-size: 13px;
      padding: 8px 18px;
    }

    .hint {
      font-size: 11px;
      color: #86909c;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>启用必要权限</h1>
      <p>BUG 工具需要以下系统权限才能正常工作，请在下方授予。</p>
    </div>

    <div class="permission-list" id="permissionList">
      <!-- 权限项由 JS 动态渲染 -->
    </div>

    <div class="footer">
      <button class="btn btn-secondary" id="btnRelaunch">重启应用</button>
      <button class="btn btn-secondary" id="btnRetry">刷新状态</button>
      <button class="btn btn-primary" id="btnContinue" disabled>继续</button>
    </div>
    <div class="hint">授权后状态会自动刷新；若已勾选「屏幕录制」但状态未变化，请点击「重启应用」生效</div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
