<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' http://127.0.0.1:8000 data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>组合图编辑器</title>
  <link rel="stylesheet" href="combine.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div id="topbar">
    <span class="topbar-title">组合图编辑器</span>
    <div class="topbar-tools">
      <!-- 方向切换 -->
      <div class="seg">
        <button id="btnDirH" class="seg-btn active" title="横向排列">横向</button>
        <button id="btnDirV" class="seg-btn" title="竖向排列">竖向</button>
      </div>
      <span class="divider"></span>
      <!-- 标注工具 -->
      <button id="btnRect" class="tool-btn" title="矩形框">▭</button>
      <button id="btnArrow" class="tool-btn" title="箭头">→</button>
      <button id="btnPen" class="tool-btn" title="画笔">✎</button>
      <button id="btnText" class="tool-btn" title="文字">T</button>
      <span class="divider"></span>
      <label class="color-picker"><input type="color" id="colorPicker" value="#ff0000"></label>
      <select id="lineWidth" class="line-width-select">
        <option value="2">细</option>
        <option value="3" selected>中</option>
        <option value="5">粗</option>
      </select>
      <span class="divider"></span>
      <button id="btnUndo" class="tool-btn" title="撤销 (Ctrl+Z)">↩</button>
      <button id="btnClear" class="tool-btn" title="清除标注">🗑</button>
      <span class="divider"></span>
      <!-- 缩放（选中图片时可用）-->
      <button id="btnZoomOut" class="tool-btn" title="缩小选中图">－图</button>
      <button id="btnZoomIn" class="tool-btn" title="放大选中图">＋图</button>
      <span class="divider"></span>
      <!-- 视图缩放 -->
      <button id="btnViewZoomOut" class="tool-btn" title="缩小视图">🔍−</button>
      <span id="viewZoomLabel" class="zoom-label">100%</span>
      <button id="btnViewZoomIn" class="tool-btn" title="放大视图">🔍+</button>
    </div>
    <div class="topbar-actions">
      <button id="btnCopy" class="act-btn" title="复制到剪贴板">复制</button>
      <button id="btnSave" class="act-btn" title="保存到桌面">保存</button>
      <button id="btnBug" class="act-btn primary" title="录入BUG" style="display:none">录入 BUG</button>
      <button id="btnClose" class="act-btn close" title="关闭">✕</button>
    </div>
  </div>

  <!-- 画布区域 -->
  <div id="canvasWrap">
    <canvas id="combineCanvas"></canvas>
    <input type="text" id="textInput" class="text-input hidden" placeholder="输入文字...">
  </div>

  <div id="hint">拖动图片可调整顺序；点击选中后可缩放</div>

  <!-- BUG 录入弹窗 -->
  <div id="bugFormOverlay" class="bug-form-overlay hidden">
    <div class="bug-form-container">
      <div class="bug-form-fields">
        <h3>录入 BUG</h3>
        <div class="bug-form-content">
          <div class="form-section">
            <div class="form-section-label">基础信息</div>
            <div class="form-group">
              <label>标题 <span class="required">*</span></label>
              <input type="text" id="bugTitle" placeholder="请输入 BUG 标题">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>BUG 类型 <span class="required">*</span></label>
                <select id="bugType">
                  <option value="ui">UI 缺陷</option>
                  <option value="functional">功能缺陷</option>
                  <option value="performance">性能问题</option>
                  <option value="security">安全问题</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div class="form-group">
                <label>优先级</label>
                <select id="bugPriority">
                  <option value="critical">紧急</option>
                  <option value="high">高</option>
                  <option value="medium" selected>中</option>
                  <option value="low">低</option>
                </select>
              </div>
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-label">人员信息</div>
            <div class="form-row">
              <div class="form-group">
                <label>录入人 <span class="required">*</span></label>
                <select id="bugReporter"></select>
              </div>
              <div class="form-group">
                <label>接收人</label>
                <select id="bugAssignee"><option value="">-- 请选择 --</option></select>
              </div>
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-label">关联信息</div>
            <div class="form-row">
              <div class="form-group">
                <label>走查项目</label>
                <select id="bugInspectionTask"><option value="">-- 不关联 --</option></select>
              </div>
              <div class="form-group">
                <label>功能模块</label>
                <select id="bugModule"><option value="">-- 不关联 --</option></select>
              </div>
            </div>
            <div class="form-group">
              <label>环境链接</label>
              <input type="url" id="bugEnvUrl" placeholder="https://...">
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-label">详细描述</div>
            <div class="form-group">
              <label>BUG 描述</label>
              <textarea id="bugDescription" rows="3" placeholder="描述 BUG 现象..."></textarea>
            </div>
            <div class="form-group">
              <label>复现步骤</label>
              <textarea id="bugReproductionSteps" rows="3" placeholder="1. 打开页面&#10;2. 执行操作&#10;3. 观察现象..."></textarea>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button id="btnBugCancel" class="btn-secondary">取消</button>
          <button id="btnBugSubmit" class="btn-primary">提交 BUG</button>
        </div>
        <div id="submitStatus" class="submit-status hidden"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="../shared/annotate.js"></script>
  <script src="combine.js"></script>
</body>
</html>
