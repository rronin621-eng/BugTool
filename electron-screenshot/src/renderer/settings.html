<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>快捷键设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 32px 24px 24px;
      user-select: none;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    #shortcutInput {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      background: #fff;
      outline: none;
    }
    #shortcutInput:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    #shortcutInput.recording {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      text-align: center;
    }
    .error {
      font-size: 12px;
      color: #ef4444;
      min-height: 18px;
      text-align: center;
      margin-bottom: 10px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      height: 36px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="title">快捷键设置</div>
  <div class="field">
    <label>全局截图快捷键</label>
    <div class="input-wrap">
      <input type="text" id="shortcutInput" readonly placeholder="点击此处并按下快捷键组合">
    </div>
    <div class="hint">点击输入框后按下组合键，例如：Cmd+Shift+A、Ctrl+Alt+S</div>
  </div>
  <div class="error" id="errorMsg"></div>
  <div class="actions">
    <button class="btn-secondary" id="btnReset">恢复默认</button>
    <button class="btn-primary" id="btnSave" disabled>保存</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
